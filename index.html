<script>
'use strict';
/* =========================================================================
   CENTRO DE CONTROL · CNC MANUFACTURING MX
   App Local-First (localStorage) + sincronización con Google Drive API v3
   Autenticación: Google Identity Services (OAuth 2.0, token client)
   Alcance: drive.file (la app solo ve los archivos que ella misma crea)
   ========================================================================= */

const APP_VERSION = '1.3.0';
const KEYS = { db:'ccmx_db_v1', sync:'ccmx_sync_v1', cfg:'ccmx_cfg_v1', token:'ccmx_token_v1', ui:'ccmx_ui_v1', device:'ccmx_device_v1' };
const DRIVE = 'https://www.googleapis.com/drive/v3';
const UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const SCOPES = 'https://www.googleapis.com/auth/drive.file';
const FOLDER_MIME = 'application/vnd.google-apps.folder';
const MULTIPART_LIMIT = 5 * 1024 * 1024;        // > 5 MB → subida reanudable
const TOMBSTONE_TTL = 90 * 24 * 3600 * 1000;     // registros borrados se purgan a los 90 días
const POLL_MS = 30000;                            // revisión de cambios remotos

const COLLECTIONS = ['proyectos','clientes','cotizaciones','compras','movimientos','avisos','catalogo','bitacora','hjPedidos','hjInformes','hjJornadas'];
const PROCESOS = ['Router CNC','Láser CO₂','Carpintería','Impresión 3D','Herrería','Mixto'];
const ETAPAS = ['Cotización','Aprobado','Diseño','Producción','Acabado','Listo para entregar','Entregado','Cancelado'];
const ETAPAS_TALLER = ['Aprobado','Diseño','Producción','Acabado','Listo para entregar'];
const ETAPA_AVANCE = { 'Cotización':5, 'Aprobado':15, 'Diseño':25, 'Producción':50, 'Acabado':80, 'Listo para entregar':95, 'Entregado':100, 'Cancelado':0 };
const ETAPA_COLOR = { 'Cotización':'#64748b', 'Aprobado':'#2563eb', 'Diseño':'#7c3aed', 'Producción':'#ea580c', 'Acabado':'#d97706', 'Listo para entregar':'#059669', 'Entregado':'#15803d', 'Cancelado':'#b91c1c' };
const NEGOCIOS = ['CNC Manufacturing','Madera Urbana','Huellas 3D','Pimienta Lab'];
const CRM_ETAPAS = ['Prospecto','Contactado','Cotizado','Cliente','Recurrente','Perdido'];
const COT_ESTADOS = ['Borrador','Enviada','Aceptada','Rechazada'];
const COMPRA_ESTADOS = ['Solicitada','Ordenada','Recibida','Pagada'];
const MOV_CATS = {
  ingreso: ['Anticipo','Pago de proyecto','Liquidación','Venta mostrador','Otro ingreso'],
  egreso: ['Material','Herrajes','Consumibles','Mano de obra','Renta','Servicios','Mantenimiento','Envíos','Impuestos','Marketing','Otro egreso']
};
const METODOS = ['Transferencia','Efectivo','Tarjeta','Cheque','Otro'];
const AVISO_TIPOS = ['Entrega','Llamada','Reunión','Pago','Compra','Mantenimiento','Otro'];
const CAT_TIPOS = ['Material','Producto','Servicio','Herraje','Consumible'];
const AREAS = ['General','Marketing','Mensajes','Diseño','Tutoriales','Legal','Equipo y permisos','Importación','Sistemas','ERP'];

/* ---------------------------- Utilidades ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const parseYMD = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const isYMD = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const num = v => { if (typeof v === 'number') return isFinite(v) ? v : 0; const n = parseFloat(String(v ?? '').replace(/[^0-9.\-]/g, '')); return isFinite(n) ? n : 0; };
const moneyFmt0 = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', maximumFractionDigits:0 });
const moneyFmt2 = new Intl.NumberFormat('es-MX', { style:'currency', currency:'MXN', minimumFractionDigits:2, maximumFractionDigits:2 });
const money = n => moneyFmt0.format(num(n));
const money2 = n => moneyFmt2.format(num(n));
const fmtDate = s => isYMD(s) ? parseYMD(s).toLocaleDateString('es-MX', { day:'2-digit', month:'short', year:'numeric' }) : '—';
const fmtDateShort = s => isYMD(s) ? parseYMD(s).toLocaleDateString('es-MX', { day:'2-digit', month:'short' }) : '—';
const fmtDateTime = ts => ts ? new Date(ts).toLocaleString('es-MX', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' }) : '—';
const daysFromToday = s => Math.round((parseYMD(s) - parseYMD(today())) / 86400000);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const ic = (name, cls = 'w-4 h-4') => `<i data-lucide="${name}" class="${cls}"></i>`;
const fmtBytes = b => { b = num(b); if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(0) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; };
const monthLabel = ym => { const [y, m] = ym.split('-').map(Number); const t = new Date(y, m - 1, 1).toLocaleDateString('es-MX', { month:'long', year:'numeric' }); return t.charAt(0).toUpperCase() + t.slice(1); };
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const readLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const writeLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { toast('El almacenamiento local del navegador está lleno. Exporta un respaldo.', 'error'); return false; } };
const waNumber = t => { let d = String(t || '').replace(/\D/g, ''); if (d.length === 10) d = '52' + d; return d; };

function icons() { if (window.lucide && lucide.createIcons) { try { lucide.createIcons(); } catch (e) { /* icono inexistente: se ignora */ } } }
function toast(msg, type = 'info', ms = 3200) {
  const w = $('#toasts'); if (!w) return;
  const t = document.createElement('div'); t.className = 'toast ' + (type === 'error' ? 'error' : type === 'ok' ? 'ok' : '');
  t.textContent = msg; w.appendChild(t); setTimeout(() => t.remove(), ms);
}
function download(filename, content, mime) {
  const blob = content instanceof Blob ? content : new Blob([content], { type: mime || 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function deviceId() { let d = localStorage.getItem(KEYS.device); if (!d) { d = 'dev-' + uid().slice(0, 8); localStorage.setItem(KEYS.device, d); } return d; }
function deviceLabel() { const ua = navigator.userAgent; if (/iPhone|Android.+Mobile/i.test(ua)) return 'Celular'; if (/iPad|Android|Tablet/i.test(ua)) return 'Tableta'; return 'Computadora'; }

/* --------------------------- Base de datos --------------------------- */
function defaultSettings() {
  return { updatedAt:0, empresa:'CNC Manufacturing MX', usuario:'Juan Carlos', iva:16, margen:45, whatsapp:'',
    tarifas:{ router:450, laser:12, impresion3d:60, manoObra:120 } };
}
function emptyDB() { return { schema:1, app:'centro-control-cnc-mx', collections:Object.fromEntries(COLLECTIONS.map(c => [c, []])), settings:defaultSettings(), updatedAt:0, lastWriter:null }; }
function normalizeDB(d) {
  const e = emptyDB();
  if (!d || typeof d !== 'object') return e;
  const out = { ...e, ...d, collections:{} };
  for (const c of COLLECTIONS) out.collections[c] = Array.isArray(d.collections && d.collections[c]) ? d.collections[c].filter(r => r && r.id) : [];
  out.settings = { ...e.settings, ...(d.settings || {}) };
  out.settings.tarifas = { ...e.settings.tarifas, ...((d.settings && d.settings.tarifas) || {}) };
  return out;
}
let db = normalizeDB(readLS(KEYS.db, null));
function persist() { writeLS(KEYS.db, db); }

const list = c => db.collections[c].filter(r => !r.deleted);
const getRec = (c, id) => id ? db.collections[c].find(r => r.id === id && !r.deleted) : null;

function upsert(c, rec, { silent = false } = {}) {
  const now = Date.now();
  const arr = db.collections[c];
  const i = rec.id ? arr.findIndex(r => r.id === rec.id) : -1;
  let id;
  if (i >= 0) {
    const prev = arr[i];
    arr[i] = { ...prev, ...rec, deleted:false, updatedAt: Math.max(now, (prev.updatedAt || 0) + 1) };
    id = prev.id;
  } else {
    id = rec.id || uid();
    arr.push({ ...rec, id, createdAt: now, updatedAt: now });
  }
  commit(silent);
  return id;
}
function removeRec(c, id) {
  const arr = db.collections[c]; const i = arr.findIndex(r => r.id === id);
  if (i < 0) return;
  arr[i] = { id, deleted:true, updatedAt: Math.max(Date.now(), (arr[i].updatedAt || 0) + 1) };
  commit();
}
function updateSettings(patch) {
  db.settings = { ...db.settings, ...patch, updatedAt: Math.max(Date.now(), (db.settings.updatedAt || 0) + 1) };
  commit();
}
function commit(silent) { db.updatedAt = Date.now(); persist(); Sync.markDirty(); if (!silent) render(); }

/* Fusión registro por registro: gana la versión con updatedAt más reciente.
   Los borrados viajan como "lápidas" {id, deleted:true, updatedAt}. */
function mergeDB(local, remote) {
  const out = emptyDB();
  const cutoff = Date.now() - TOMBSTONE_TTL;
  for (const c of COLLECTIONS) {
    const map = new Map();
    for (const r of local.collections[c]) map.set(r.id, r);
    for (const r of remote.collections[c]) {
      const l = map.get(r.id);
      if (!l || (r.updatedAt || 0) > (l.updatedAt || 0)) map.set(r.id, r);
    }
    out.collections[c] = Array.from(map.values()).filter(r => !(r.deleted && (r.updatedAt || 0) < cutoff));
  }
  out.settings = (remote.settings.updatedAt || 0) > (local.settings.updatedAt || 0) ? remote.settings : local.settings;
  out.updatedAt = Math.max(local.updatedAt || 0, remote.updatedAt || 0);
  out.lastWriter = remote.lastWriter || local.lastWriter || null;
  return out;
}
function signature(d) {
  const parts = [String(d.settings.updatedAt || 0)];
  for (const c of COLLECTIONS) parts.push(c + ':' + d.collections[c].map(r => r.id + '@' + (r.updatedAt || 0)).sort().join(','));
  return parts.join('|');
}

/* ---------------------- Configuración / estado UI ---------------------- */
const cfgDefault = { clientId:'', folderName:'App_Sistema_Respaldo', fileName:'base_datos_sistema.json' };
let cfg = { ...cfgDefault, ...readLS(KEYS.cfg, {}) };
function saveCfg() { writeLS(KEYS.cfg, cfg); }

const ui = {
  route: 'resumen',
  calMonth: today().slice(0, 7),
  calSel: today(),
  finMonth: today().slice(0, 7),
  q: {}, f: {},
  ...readLS(KEYS.ui, {})
};
function saveUI() { writeLS(KEYS.ui, { calMonth: ui.calMonth, finMonth: ui.finMonth, f: ui.f }); }

/* =====================================================================
   MOTOR DE SINCRONIZACIÓN · GOOGLE DRIVE API v3
   ===================================================================== */
class SyncError extends Error { constructor(code, msg, status) { super(msg); this.code = code; this.status = status; } }

const Sync = (() => {
  const defState = { fileId:null, folderId:null, attachFolderId:null, remoteVersion:null, dirty:false, lastSync:0, everConnected:false, account:null, lastError:'' };
  let st = { ...defState, ...readLS(KEYS.sync, {}) };
  let token = readLS(KEYS.token, null);
  let tokenClient = null, tokenClientId = null;
  let status = 'idle', statusMsg = '';
  let syncing = false, again = false, timer = null, lastSilentTry = 0;
  let pendingToken = null;

  const save = () => writeLS(KEYS.sync, st);
  const hasToken = () => !!(token && token.access_token && token.expires_at > Date.now());
  const clearToken = () => { token = null; localStorage.removeItem(KEYS.token); };

  function computeIdle() {
    if (!cfg.clientId) return 'noconfig';
    if (!navigator.onLine) return 'offline';
    if (!hasToken()) return st.dirty ? 'offline' : 'disconnected';
    return st.dirty ? 'saving' : 'ok';
  }
  function setStatus(s, msg = '') { status = s; statusMsg = msg; renderStatus(); }

  /* ---------- Google Identity Services ---------- */
  function gisReady() { return !!(window.google && google.accounts && google.accounts.oauth2); }
  function waitGIS(ms = 8000) {
    return new Promise(res => {
      if (gisReady()) return res(true);
      const t0 = Date.now(); const iv = setInterval(() => { if (gisReady()) { clearInterval(iv); res(true); } else if (Date.now() - t0 > ms) { clearInterval(iv); res(false); } }, 120);
    });
  }
  function initClient() {
    if (!cfg.clientId || !gisReady()) return false;
    if (tokenClient && tokenClientId === cfg.clientId) return true;
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: cfg.clientId,
      scope: SCOPES,
      callback: onToken,
      error_callback: err => {
        const msg = err && err.type === 'popup_closed' ? 'Ventana de Google cerrada' : (err && err.type === 'popup_failed_to_open' ? 'El navegador bloqueó la ventana de Google' : 'No se pudo iniciar sesión');
        if (pendingToken) { pendingToken.reject(new SyncError('AUTH', msg)); pendingToken = null; }
        setStatus(computeIdle(), msg);
      }
    });
    tokenClientId = cfg.clientId;
    return true;
  }
  function onToken(resp) {
    if (!resp || resp.error) {
      const msg = resp && resp.error_description ? resp.error_description : 'Acceso denegado';

const isActive = p => !['Entregado', 'Cancelado'].includes(p.etapa);

const movsOf = pid => list('movimientos').filter(m => m.proyectoId === pid);
const projPaid = pid => movsOf(pid).filter(m => m.tipo === 'ingreso').reduce((s, m) => s + num(m.monto), 0);
const projSpent = pid => movsOf(pid).filter(m => m.tipo === 'egreso').reduce((s, m) => s + num(m.monto), 0);
const projSaldo = p => Math.max(0, projTotal(p) - projPaid(p.id));
const cotTotals = c => { const sub = (c.partidas || []).reduce((s, it) => s + num(it.cant) * num(it.pu), 0); const iva = c.conIVA === false ? 0 : sub * num(db.settings.iva) / 100; return { sub, iva, total: sub + iva }; };
const newFolio = () => { let f; do { f = `CNC-${new Date().getFullYear()}-${String(Math.floor(Math.random() * 1e6)).padStart(6, '0')}`; } while (list('proyectos').some(p => p.folio === f)); return f; };
const newCotFolio = () => { const y = new Date().getFullYear(); const n = list('cotizaciones').filter(c => (c.folio || '').startsWith(`COT-${y}-`)).map(c => parseInt(c.folio.split('-')[2], 10) || 0); return `COT-${y}-${String((n.length ? Math.max(...n) : 0) + 1).padStart(4, '0')}`; };

function overdueItems() {
  const t = today(); const out = [];
  list('avisos').forEach(a => { if (!a.completado && isYMD(a.fecha) && a.fecha < t) out.push({ kind:'aviso', id:a.id, title:a.titulo, fecha:a.fecha }); });
  list('proyectos').forEach(p => { if (isActive(p) && p.etapa !== 'Cotización' && isYMD(p.fechaEntrega) && p.fechaEntrega < t) out.push({ kind:'entrega', id:p.id, title:`Entrega: ${p.nombre}`, fecha:p.fechaEntrega }); });
  list('hjPedidos').forEach(p => { if (!hjDone(p) && isYMD(p.fechaEntrega) && p.fechaEntrega < t) out.push({ kind:'hj', id:p.id, title:`Hebillas JA: ${p.titulo} (${hjPendiente(p)} pend.)`, fecha:p.fechaEntrega }); });
  return out.sort((a, b) => a.fecha.localeCompare(b.fecha));
}
function eventsByDate() {
  const map = {};
  const add = (d, e) => { if (!isYMD(d)) return; (map[d] = map[d] || []).push(e); };
  list('avisos').forEach(a => add(a.fecha, { kind:'aviso', id:a.id, title:a.titulo, hora:a.hora, tipo:a.tipo, done:!!a.completado, color: a.completado ? '#94a3b8' : '#2563eb' }));
  list('proyectos').forEach(p => { if (p.etapa !== 'Cancelado') add(p.fechaEntrega, { kind:'entrega', id:p.id, title:`Entrega · ${p.nombre}`, done:p.etapa === 'Entregado', color: p.etapa === 'Entregado' ? '#94a3b8' : '#f97316' }); });

  list('hjPedidos').forEach(p => { if (p.etapa !== 'Cancelado') add(p.fechaEntrega, { kind:'hj', id:p.id, title:`Hebillas JA · ${p.titulo} (${hjPendiente(p)} pend.)`, done: p.etapa === 'Entregado', color: p.etapa === 'Entregado' ? '#94a3b8' : '#0891b2' }); });
  Object.values(map).forEach(arr => arr.sort((a, b) => String(a.hora || '99').localeCompare(String(b.hora || '99'))));

}
function kpis() {
  const ps = list('proyectos');
  const act = ps.filter(isActive);
  const ym = today().slice(0, 7);
  const movM = list('movimientos').filter(m => (m.fecha || '').startsWith(ym));
  const ing = movM.filter(m => m.tipo === 'ingreso').reduce((s, m) => s + num(m.monto), 0);
  const egr = movM.filter(m => m.tipo === 'egreso').reduce((s, m) => s + num(m.monto), 0);
  return {
    activos: act.length,
    produccion: act.filter(p => ['Producción', 'Acabado'].includes(p.etapa)).length,
    listos: act.filter(p => p.etapa === 'Listo para entregar').length,

    porCobrar: ps.filter(p => p.etapa !== 'Cancelado' && p.etapa !== 'Cotización').reduce((s, p) => s + projSaldo(p), 0),
    ing, egr, util: ing - egr
  };
}

/* Calendario (lunes primero) */
function calendarHTML({ big = false } = {}) {
  const [y, m] = ui.calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(y, m - 1, 1 - offset);
  const ev = eventsByDate(); const t = today();
  const cells = [];
  const weeks = Math.ceil((offset + new Date(y, m, 0).getDate()) / 7);
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const k = ymd(d); const e = ev[k] || [];
    const out = d.getMonth() !== m - 1;
    cells.push(`<button class="cal-day ${out ? 'out' : ''} ${k === t ? 'today' : ''} ${k === ui.calSel ? 'sel' : ''}" data-act="cal-sel" data-d="${k}">
      <span>${d.getDate()}</span>
      ${big ? `<div class="mt-1 space-y-0.5 hidden sm:block">${e.slice(0, 3).map(x => `<div class="truncate text-[10.5px] rounded px-1" style="background:${x.color}1f;color:${k === ui.calSel ? '#fff' : x.color};${x.done ? 'text-decoration:line-through' : ''}">${esc(x.title)}</div>`).join('')}${e.length > 3 ? `<div class="text-[10px] opacity-70">+${e.length - 3} más</div>` : ''}</div>` : ''}
      ${e.length ? `<span class="dots ${big ? 'sm:hidden' : ''}">${e.slice(0, 4).map(x => `<i style="background:${x.color}"></i>`).join('')}</span>` : ''}
    </button>`);
  }
  return `<div class="${big ? 'cal-big' : ''}">
    <div class="flex items-center justify-between mb-3"><button class="btn btn-ghost btn-sm" data-act="cal-prev" aria-label="Mes anterior">${ic('chevron-left')}</button><div class="font-bold">${monthLabel(ui.calMonth)}</div><div class="flex gap-1"><button class="btn btn-ghost btn-sm" data-act="cal-today">Hoy</button><button class="btn btn-ghost btn-sm" data-act="cal-next" aria-label="Mes siguiente">${ic('chevron-right')}</button></div></div>
    <div class="cal-grid mb-1">${['L', 'M', 'M', 'J', 'V', 'S', 'D'].map(d => `<div class="text-center text-[11px] font-bold text-slate-400">${d}</div>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div></div>`;
}
function dayPanelHTML() {
  const e = eventsByDate()[ui.calSel] || [];
  return `<div class="mt-4"><div class="flex items-center justify-between mb-2"><div class="font-semibold text-sm">${parseYMD(ui.calSel).toLocaleDateString('es-MX', { weekday:'long', day:'numeric', month:'long' })}</div><button class="btn btn-sm" data-act="new-aviso" data-d="${ui.calSel}">${ic('bell-plus')}Crear aviso</button></div>

const modalHead = (title, sub = '') => `<div class="modal-head"><div class="min-w-0"><div class="font-bold text-lg truncate">${esc(title)}</div>${sub ? `<div class="text-[12px] text-slate-500 truncate">${esc(sub)}</div>` : ''}</div><button class="btn btn-ghost btn-sm" data-act="modal-close" aria-label="Cerrar">${ic('x', 'w-5 h-5')}</button></div>`;

function optionsHTML(options, v) {
  return options.map(o => { const val = typeof o === 'object' ? o.v : o; const lab = typeof o === 'object' ? o.l : o; return `<option value="${esc(val)}" ${String(val) === String(v ?? '') ? 'selected' : ''}>${esc(lab)}</option>`; }).join('');
}
function fieldHTML(f, v) {
  const id = 'fld_' + f.k;
  const req = f.req ? 'required' : '';
  let ctrl = '';
  switch (f.type) {
    case 'select': ctrl = `<select id="${id}" name="${f.k}" class="inp" ${req}>${f.blank ? `<option value="">${esc(f.blank)}</option>` : ''}${optionsHTML(f.options, v ?? f.def)}</select>`; break;
    case 'textarea': ctrl = `<textarea id="${id}" name="${f.k}" class="inp" rows="${f.rows || 3}" placeholder="${esc(f.ph || '')}">${esc(v ?? '')}</textarea>`; break;
    case 'checkbox': ctrl = `<label class="flex items-center gap-2 min-h-[44px]"><input type="checkbox" id="${id}" name="${f.k}" class="w-5 h-5 accent-orange-500" ${(v ?? f.def) ? 'checked' : ''}><span class="text-sm">${esc(f.text || '')}</span></label>`; break;
    case 'client': {
      const cs = list('clientes').sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));
      ctrl = `<select id="${id}" name="${f.k}" class="inp"><option value="">— Selecciona cliente —</option>${cs.map(c => `<option value="${c.id}" ${c.id === v ? 'selected' : ''}>${esc(c.nombre)}${c.empresa ? ' · ' + esc(c.empresa) : ''}</option>`).join('')}</select>
        <input name="_nuevoCliente" class="inp mt-2" placeholder="…o escribe un cliente nuevo">`; break;
    }
    case 'project': {
      const ps = list('proyectos').filter(p => p.etapa !== 'Cancelado' || p.id === v).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      ctrl = `<select id="${id}" name="${f.k}" class="inp"><option value="">— Sin proyecto —</option>${ps.map(p => `<option value="${p.id}" ${p.id === v ? 'selected' : ''}>${esc(p.nombre)} (${esc(p.folio)})</option>`).join('')}</select>`; break;
    }
    case 'items': ctrl = itemsEditor(v || []); break;
    default: {
      const t = ['money', 'number', 'percent'].includes(f.type) ? 'number' : (f.type || 'text');
      const step = f.type === 'money' ? 'step="0.01" inputmode="decimal"' : (f.type === 'percent' || f.type === 'number') ? `step="${f.step || 'any'}" inputmode="decimal"` : '';
      const lst = f.datalist ? `list="dl_${f.k}"` : '';
      ctrl = `<input id="${id}" name="${f.k}" type="${t}" ${step} ${lst} class="inp" value="${esc(v ?? f.def ?? '')}" placeholder="${esc(f.ph || '')}" ${req} ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''}>${f.datalist ? `<datalist id="dl_${f.k}">${f.datalist.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : ''}`;
    }
  }
  return `<div class="${f.full || f.type === 'items' || f.type === 'textarea' ? 'sm:col-span-2' : ''}">${f.type === 'checkbox' ? '' : `<label class="lbl" for="${id}">${esc(f.label)}${f.req ? ' <span class="text-red-500">*</span>' : ''}</label>`}${ctrl}${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ''}</div>`;
}
function itemRowHTML(it = {}) {
  return `<div class="item-row grid grid-cols-12 gap-2 items-center"><input class="inp col-span-12 sm:col-span-6" data-it="desc" placeholder="Descripción" value="${esc(it.desc || '')}"><input class="inp col-span-3 sm:col-span-2" data-it="cant" type="number" step="any" inputmode="decimal" placeholder="Cant." value="${esc(it.cant ?? 1)}"><input class="inp col-span-6 sm:col-span-3" data-it="pu" type="number" step="0.01" inputmode="decimal" placeholder="P. unitario" value="${esc(it.pu ?? '')}"><button type="button" class="btn btn-ghost btn-sm col-span-3 sm:col-span-1 text-red-600" data-act="item-del" aria-label="Quitar partida">${ic('trash-2')}</button></div>`;

function itemsEditor(items) {
  const t = db.settings.tarifas;
  return `<div class="rounded-xl border border-slate-200 p-3 space-y-2" id="itemsBox">
    <div class="flex items-center justify-between"><div class="font-semibold text-sm">Partidas</div><button type="button" class="btn btn-sm" data-act="item-add">${ic('plus')}Agregar partida</button></div>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-3" id="calcBox">
        ${[['c_mat', 'Material $', ''], ['c_router', `Router (h) · ${money(t.router)}/h`, ''], ['c_laser', `Láser (min) · ${money(t.laser)}/min`, ''], ['c_3d', `Impresión 3D (h) · ${money(t.impresion3d)}/h`, ''], ['c_mo', `Mano de obra (h) · ${money(t.manoObra)}/h`, ''], ['c_ext', 'Herrajes, acabado, empaque $', ''], ['c_qty', 'Piezas', '1'], ['c_merma', 'Merma %', '10'], ['c_margen', 'Margen %', String(num(db.settings.margen))]].map(([k, l, d]) => `<label class="block"><span class="lbl">${l}</span><input class="inp" data-calc="${k}" type="number" step="any" inputmode="decimal" value="${d}"></label>`).join('')}
      </div>
      <div class="mt-3 text-sm flex flex-wrap items-center gap-3" id="calcOut"></div>
    </details>
  </div>`;
}
function calcQuick() {
  const box = $('#calcBox'); if (!box) return null;
  const g = k => num((box.querySelector(`[data-calc="${k}"]`) || {}).value);
  const t = db.settings.tarifas;
  const qty = Math.max(1, g('c_qty'));
  const mat = g('c_mat') * (1 + g('c_merma') / 100);
  const maq = g('c_router') * num(t.router) + g('c_laser') * num(t.laser) + g('c_3d') * num(t.impresion3d);
  const mo = g('c_mo') * num(t.manoObra);
  const costo = mat + maq + mo + g('c_ext');
  const margen = Math.min(95, Math.max(0, g('c_margen')));
  const precio = costo / (1 - margen / 100);
  const out = { costo, precio, qty, unit: precio / qty, unitCost: costo / qty };
  const el = $('#calcOut');
  if (el) el.innerHTML = `<span>Costo total: <b>${money2(costo)}</b></span><span>Precio sugerido: <b class="text-brand-700">${money2(precio)}</b></span><span>Por pieza: <b>${money2(out.unit)}</b></span><button type="button" class="btn btn-sm btn-primary" data-act="calc-apply">${ic('plus')}Agregar como partida</button>`;
  icons();
  return out;
}

  const sub = items.reduce((s, it) => s + num(it.cant) * num(it.pu), 0);

}
function collectItems() {
  return $$('#itemsRows .item-row').map(r => ({ desc: r.querySelector('[data-it=desc]').value.trim(), cant: num(r.querySelector('[data-it=cant]').value), pu: num(r.querySelector('[data-it=pu]').value) })).filter(it => it.desc || it.pu);
}

/* Formulario genérico */
function openForm({ title, sub = '', fields, data = {}, onSave, onDelete = null, extra = '', size = 'lg', back = null, saveLabel = 'Guardar' }) {
  formCtx = { fields, onSave, onDelete, back, data };
  openModal(`${modalHead(title, sub)}
    <form id="modalForm" class="modal-body" novalidate><div class="grid sm:grid-cols-2 gap-3">${fields.map(f => fieldHTML(f, data[f.k])).join('')}</div>${extra}</form>
    <div class="modal-foot">${onDelete ? `<button class="btn btn-danger mr-auto" data-act="form-delete">${ic('trash-2')}Eliminar</button>` : ''}<button class="btn" data-act="form-cancel">Cancelar</button><button class="btn btn-primary" data-act="form-save">${ic('check')}${saveLabel}</button></div>`, size);
  if ($('#itemsBox')) { updateItemsTotals(); calcQuick(); }
}
function collectForm() {
  const form = $('#modalForm'); const out = {}; let err = null;
  for (const f of formCtx.fields) {
    if (f.type === 'items') { out[f.k] = collectItems(); continue; }
    const el = form.elements[f.k]; if (!el) continue;
    let v;
    if (f.type === 'checkbox') v = el.checked;
    else if (['money', 'number', 'percent'].includes(f.type)) v = el.value === '' ? (f.def ?? 0) : num(el.value);
    else v = String(el.value).trim();
    if (f.req && (v === '' || v == null) && !(f.type === 'client' && form.elements._nuevoCliente && form.elements._nuevoCliente.value.trim())) { err = `Falta: ${f.label}`; el.focus(); break; }
    out[f.k] = v;
  }
  if (!err && form.elements._nuevoCliente) out._nuevoCliente = form.elements._nuevoCliente.value.trim();
  return { values: out, err };
}
function resolveClient(values) {
  if (!values.clienteId && values._nuevoCliente) {
    const existing = list('clientes').find(c => c.nombre.toLowerCase() === values._nuevoCliente.toLowerCase());
    values.clienteId = existing ? existing.id : upsert('clientes', { nombre: values._nuevoCliente, etapa: 'Cotizado' }, { silent:true });
  }
  delete values._nuevoCliente;
  return values;
}

let attachTarget = null;
function attachmentsPanel(col, rec) {
  const files = rec.adjuntos || [];
  const can = Sync.hasToken();
  return `<div><div class="flex items-center justify-between mb-2 gap-2"><div class="font-bold">Expediente digital · archivos en Drive</div>
    <button class="btn btn-sm ${can ? 'btn-primary' : ''}" data-act="attach" data-col="${col}" data-id="${rec.id}" ${can ? '' : 'disabled title="Conecta Google Drive para adjuntar"'}>${ic('paperclip')}Adjuntar</button></div>
    ${!can ? `<div class="text-[12px] text-slate-500 mb-2">Conecta Google Drive para adjuntar planos, fotos, comprobantes o archivos de corte (DXF, SVG, STL, PDF…).</div>` : ''}
    <div id="attachProgress" class="text-sm text-brand-700 hidden mb-2"></div>
    ${files.length ? `<div class="grid sm:grid-cols-2 gap-2">${files.map(f => `<div class="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2"><div class="w-8 h-8 rounded-lg bg-slate-100 grid place-items-center shrink-0">${ic(/image/.test(f.mimeType) ? 'image' : /pdf/.test(f.mimeType) ? 'file-text' : 'file', 'w-4 h-4')}</div><a href="${esc(f.link)}" target="_blank" rel="noopener" class="min-w-0 flex-1"><div class="text-sm font-medium truncate">${esc(f.name)}</div><div class="text-[11px] text-slate-500">${fmtBytes(f.size)} · ${fmtDateTime(f.uploadedAt)}</div></a><button class="btn btn-ghost btn-sm text-red-600" data-act="attach-del" data-col="${col}" data-id="${rec.id}" data-fid="${esc(f.fileId)}" aria-label="Quitar">${ic('x')}</button></div>`).join('')}</div>` : '<div class="text-sm text-slate-400">Sin archivos.</div>'}
  </div>`;
}
async function handleAttachFiles(files) {
  if (!attachTarget || !files.length) return;
  const { col, id } = attachTarget;
  const rec = getRec(col, id); if (!rec) return;
  const prog = $('#attachProgress');
  const prefix = rec.folio || (col === 'compras' ? 'COMPRA-' + (rec.proveedor || '') : col === 'movimientos' ? 'MOV-' + (rec.fecha || '') : col);
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    if (prog) { prog.classList.remove('hidden'); prog.textContent = `Subiendo ${i + 1}/${files.length}: ${f.name} (${fmtBytes(f.size)})…`; }
    try {
      Sync.setStatus('saving', 'Subiendo adjunto…');
      const meta = await Sync.uploadFile(f, { prefix: String(prefix).replace(/[\\/:*?"<>|]/g, '-').slice(0, 60), description: `Adjunto de ${col}: ${rec.nombre || rec.titulo || rec.concepto || rec.proveedor || id}` });
      const cur = getRec(col, id);
      upsert(col, { id, adjuntos: [ ...((cur && cur.adjuntos) || []), meta ] }, { silent:true });
      ok++;
    } catch (e) { toast(`No se pudo subir ${f.name}: ${e.message}`, 'error', 5000); if (e.code === 'AUTH') break; }
  }
  if (ok) toast(`${ok} archivo(s) guardado(s) en Drive`, 'ok');
  render(); reopenAfterAttach(col, id);
}
function reopenAfterAttach(col, id) {
  if (col === 'proyectos') openExpediente(id);
  else if (col === 'compras') openCompraForm(id);
  else if (col === 'movimientos') openMovForm(id);
  else if (col === 'hjPedidos') openHJ(id);
}

function avisoICS(id) {
  const a = getRec('avisos', id); if (!a) return;
  const d = a.fecha.replace(/-/g, '');
  const hasT = /^\d{2}:\d{2}$/.test(a.hora || '');
  const start = hasT ? `DTSTART;TZID=America/Mexico_City:${d}T${a.hora.replace(':', '')}00` : `DTSTART;VALUE=DATE:${d}`;
  const endD = parseYMD(a.fecha); endD.setDate(endD.getDate() + 1);
  const end = hasT ? `DTEND;TZID=America/Mexico_City:${d}T${String(Math.min(23, parseInt(a.hora, 10) + 1)).padStart(2, '0')}${a.hora.slice(3)}00` : `DTEND;VALUE=DATE:${ymd(endD).replace(/-/g, '')}`;
  const icsEsc = s => String(s || '').replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//CNC Manufacturing MX//Centro de Control//ES', 'BEGIN:VEVENT', `UID:${a.id}@centro-control-cnc-mx`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').split('.')[0]}Z`, start, end, `SUMMARY:${icsEsc(a.titulo)}`, `DESCRIPTION:${icsEsc((a.notas || '') + (a.proyectoId ? '\nProyecto: ' + projLabel(a.proyectoId) : ''))}`, 'BEGIN:VALARM', 'TRIGGER:-PT30M', 'ACTION:DISPLAY', 'DESCRIPTION:Recordatorio', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  download(`aviso-${a.fecha}.ics`, ics, 'text/calendar;charset=utf-8');
}

function saveDriveConfig() {
  const id = $('#cfg_client').value.trim();
  const folder = ($('#cfg_folder').value || cfgDefault.folderName).trim();
  const file = ($('#cfg_file').value || cfgDefault.fileName).trim();
  if (id && !/\.apps\.googleusercontent\.com$/.test(id)) { toast('El Client ID debe terminar en .apps.googleusercontent.com', 'error', 5000); return false; }
  const changedClient = id !== cfg.clientId;

  cfg = { ...cfg, clientId:id, folderName:folder, fileName:file }; saveCfg();
  if (changedTarget && !changedClient) Sync.resetLink();
  Sync.setStatus(Sync.computeIdle());
  toast('Configuración guardada', 'ok');

/* ---- Respaldo / restauración ---- */
function exportJSON() {
  const n = new Date(); const stamp = `${ymd(n)}_${pad(n.getHours())}${pad(n.getMinutes())}`;
  download(`respaldo_centro_control_${stamp}.json`, JSON.stringify({ ...db, exportedAt: new Date().toISOString(), exportedBy:'Centro de Control CNC MX ' + APP_VERSION }, null, 2), 'application/json');
  toast('Respaldo JSON descargado', 'ok');
}
function exportCSV(col) {
  const rows = list(col);
  if (!rows.length) { toast('No hay registros para exportar', 'error'); return; }
  const keys = [...new Set(rows.flatMap(r => Object.keys(r)))].filter(k => k !== 'deleted');
  const extra = col === 'proyectos' ? ['cliente', 'cobrado', 'saldo'] : (col === 'cotizaciones' || col === 'compras' || col === 'movimientos') ? ['cliente_o_proyecto'] : [];
  const cell = v => { if (v == null) return ''; if (typeof v === 'object') v = JSON.stringify(v); v = String(v); return /[",\n;]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const fmtVal = (k, v) => (k === 'createdAt' || k === 'updatedAt') && v ? new Date(v).toISOString() : v;
  const lines = [[...keys, ...extra].join(',')];
  rows.forEach(r => {
    const ex = col === 'proyectos' ? [clientName(r), projPaid(r.id).toFixed(2), projSaldo(r).toFixed(2)] : extra.length ? [r.clienteId || r.clienteNombre ? clientName(r) : r.proyectoId ? projLabel(r.proyectoId) : ''] : [];
    lines.push([...keys.map(k => cell(fmtVal(k, r[k]))), ...ex.map(cell)].join(','));
  });
  download(`${col}_${today()}.csv`, '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}
function restoreFromFile(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let data;
    try { data = JSON.parse(rd.result); } catch (e) { toast('El archivo no es un JSON válido', 'error'); return; }
    if (!data || typeof data !== 'object' || !data.collections) { toast('El archivo no parece un respaldo del Centro de Control', 'error'); return; }
    const imp = normalizeDB(data);
    const n = COLLECTIONS.reduce((s, c) => s + imp.collections[c].filter(r => !r.deleted).length, 0);
    formCtx = null;
    window.__restoreData = imp;
    openModal(`${modalHead('Restaurar respaldo', file.name)}<div class="modal-body space-y-3 text-sm"><p>El archivo contiene <b>${n}</b> registros${data.exportedAt ? ` (exportado ${esc(new Date(data.exportedAt).toLocaleString('es-MX'))})` : ''}.</p>
      <div class="rounded-xl border border-slate-200 p-3"><b>Combinar</b> — agrega lo que falte y conserva la versión más reciente de cada registro. Recomendado.</div>
      <div class="rounded-xl border border-red-200 bg-red-50 p-3"><b>Reemplazar todo</b> — los datos actuales se sustituyen por los del archivo en todos los dispositivos sincronizados.</div></div>
      <div class="modal-foot"><button class="btn" data-act="modal-close">Cancelar</button><button class="btn btn-danger" data-act="restore-replace">Reemplazar todo</button><button class="btn btn-primary" data-act="restore-merge">Combinar</button></div>`, 'md');
  };
  rd.readAsText(file);
}
function applyRestore(mode) {
  const imp = window.__restoreData; if (!imp) return;
  const now = Date.now();
  if (mode === 'merge') {
    db = mergeDB(db, imp);
  } else {
    const out = emptyDB();
    for (const c of COLLECTIONS) {
      const ids = new Set(imp.collections[c].map(r => r.id));
      out.collections[c] = [
        ...imp.collections[c].map(r => ({ ...r, updatedAt: now + 1 })),
        ...db.collections[c].filter(r => !ids.has(r.id)).map(r => ({ id:r.id, deleted:true, updatedAt: now + 1 }))
      ];
    }
    out.settings = { ...imp.settings, updatedAt: now + 1 };
    db = out;
  }
  window.__restoreData = null;
  db.updatedAt = now; persist(); Sync.markDirty();
  closeModal(); render(); toast('Respaldo restaurado', 'ok');
}

  const y = new Date().getFullYear();
  const mkC = (nombre, empresa) => { const ex = list('clientes').find(c => c.nombre === nombre); return ex ? ex.id : upsert('clientes', { nombre, empresa, etapa:'Cliente', origen:'Importado' }, { silent:true }); };
  const cF = mkC('Francisco', ''), cV = mkC('Vicente Rojas', 'Gala de Monturas'), cH = mkC('Antonio Mora Piña', 'Hebillas JA'), cJ = mkC('Lic. José González', '');
  const P = [
    ['LIBREROS', cF, 'Herrería', 35, '12-15', 13340, 'CNC-2026-078382'],
    ['Estuche sombreros', cV, 'Carpintería', 35, '12-12', 27500, 'CNC-2026-447658'],

    ['ESTUCHES HEBILLAS JA 2026', cH, 'Láser CO₂', 100, '12-31', 480000, 'CNC-2026-236114'],

/* =====================================================================
   HEBILLAS JA · producción recurrente
   Pedidos con 9 etapas, entregas parciales con recibo, equivalencias,
   estimación por lote, productividad diaria e informes cada 800 equiv.
   ===================================================================== */
const HJ_TIPOS = [
  { v:'chica', l:'Caja chica', eq:1 }, { v:'mediana', l:'Caja mediana', eq:1.5 }, { v:'grande', l:'Caja grande', eq:2 },
  { v:'trofeo', l:'Caja trofeo', eq:4 }, { v:'tapa', l:'Tapa de reposición', eq:0.5 }
];
const HJ_EQ = Object.fromEntries(HJ_TIPOS.map(t => [t.v, t.eq]));
const hjTipoLabel = v => (HJ_TIPOS.find(t => t.v === v) || { l: v || '—' }).l;
const HJ_ETAPAS = ['Solicitud recibida', 'Diseño enviado', 'Diseño aprobado', 'Cortado', 'Grabado', 'Espuma lista', 'Empacado', 'Entrega parcial', 'Entregado'];
const HJ_CONF = ['Firma física en el recibo', 'Aceptación digital'];
const HJ_BASES = [
  { v:'chica', l:'Cajas chicas' }, { v:'mediana', l:'Cajas medianas' }, { v:'grande', l:'Cajas grandes' }, { v:'trofeo', l:'Cajas trofeo' },
  { v:'cajas', l:'Todas las cajas' }, { v:'tapas', l:'Tapas (cajas + reposición)' }, { v:'tapaFrente', l:'Tapas con grabado frontal' }, { v:'tapaInterior', l:'Tapas con grabado interior' }
];
const HJ_OPS_DEFAULT = [
  ['cortar-chicas', 'Cortar cajas chicas', 'chica', 22, 16, 'maquina'],
  ['cortar-medianas', 'Cortar cajas medianas', 'mediana', 22, 10, 'maquina'],
  ['cortar-grandes', 'Cortar cajas grandes', 'grande', 18, 10, 'maquina'],
  ['cortar-trofeo', 'Cortar cajas trofeo', 'trofeo', 18, 6, 'maquina'],
  ['cortar-tapas', 'Cortar tapas', 'tapas', 9, 48, 'maquina'],
  ['grabar-frente', 'Grabar tapas por el frente', 'tapaFrente', 330, 48, 'maquina'],
  ['grabar-interior', 'Grabar tapas por el interior', 'tapaInterior', 90, 35, 'maquina'],
  ['lijar-tapas', 'Lijar tapas', 'tapas', 90, 100, 'humano'],
  ['armar-cajas', 'Armar cajas', 'cajas', 60, 50, 'humano'],
  ['cortar-espumas', 'Cortar espumas', 'cajas', 18, 58, 'maquina'],
  ['armar-espumas', 'Armar espumas', 'cajas', 60, 150, 'humano'],
  ['pintar-espumas', 'Pintar espumas', 'cajas', 15, 65, 'humano']
].map(([id, nombre, base, min, pzs, tipo]) => ({ id, nombre, base, min, pzs, tipo }));
function hjDefaultSettings() {
  return { telefono:'', contacto:'Araceli', meta:800,
    est: { vol:{ chica:800, mediana:0, grande:0, trofeo:0, tapa:0, tapaFrente:0, tapaInterior:0 },
      jornada:{ entrada:'09:00', salida:'01:30', comida:30, descansos:120, prep:30, compu:120, objetivo:10, imprevistos:15, solapar:true },
      ops: HJ_OPS_DEFAULT.map(o => ({ ...o })) } };
}
function hjNormalizeSettings(s) {
  const d = hjDefaultSettings(); const h = (s && s.hj) || {};
  const est = h.est || {};
  return { ...d, ...h, est: { vol: { ...d.est.vol, ...(est.vol || {}) }, jornada: { ...d.est.jornada, ...(est.jornada || {}) }, ops: Array.isArray(est.ops) && est.ops.length ? est.ops : d.est.ops } };
}
const hjS = () => hjNormalizeSettings(db.settings);
const hjEq = p => num(p.cantidad) * (HJ_EQ[p.tipo] ?? 1);
const hjEntregado = p => (p.entregas || []).reduce((s, e) => s + num(e.cant), 0);
const hjPendiente = p => Math.max(0, num(p.cantidad) - hjEntregado(p));
const hjDone = p => p.etapa === 'Entregado' || p.etapa === 'Cancelado';
const hjStepIdx = p => Math.max(0, HJ_ETAPAS.indexOf(p.etapa));
const hjFmtEq = n => (Math.round(num(n) * 10) / 10).toLocaleString('es-MX');
function hjNewFolio() {
  const d = new Date(); let f;
  do { f = `JA-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.floor(Math.random() * 65536).toString(16).toUpperCase().padStart(4, '0')}`; }
  while (list('hjPedidos').some(p => p.folio === f));
  return f;
}
const hjLog = (p, texto) => [...(p.bitacora || []), { texto, at: Date.now(), device: deviceLabel() }];

function hjKpis() {
  const ps = list('hjPedidos').filter(p => p.etapa !== 'Cancelado');
  const act = ps.filter(p => !hjDone(p));
  const pendEq = p => hjPendiente(p) * (HJ_EQ[p.tipo] ?? 1);
  return {
    revisar: ps.filter(p => p.etapa === 'Solicitud recibida').length,
    urgentes: act.filter(p => p.prioridad === 'Urgente').length,
    total: ps.reduce((s, p) => s + hjEq(p), 0),
    entregadas: ps.reduce((s, p) => s + hjEntregado(p) * (HJ_EQ[p.tipo] ?? 1), 0),
    porFabricar: act.filter(p => hjStepIdx(p) < 3).reduce((s, p) => s + pendEq(p), 0),
    enFabricacion: act.filter(p => hjStepIdx(p) >= 3).reduce((s, p) => s + pendEq(p), 0),
    activos: act.length
  };
}

/* ---- Informes de 800 equivalencias (saldo excedente pasa al siguiente) ---- */
function hjInformesCalc() {
  const meta = num(hjS().meta) || 800;
  const peds = list('hjPedidos').filter(p => p.etapa !== 'Cancelado').sort((a, b) => String(a.creado || '').localeCompare(String(b.creado || '')) || String(a.folio).localeCompare(String(b.folio)));
  const closed = list('hjInformes').sort((a, b) => num(a.num) - num(b.num));
  const assigned = new Set(closed.flatMap(i => i.folios || []));
  let saldo = 0; const out = [];
  closed.forEach(i => {
    const ps = (i.folios || []).map(f => peds.find(p => p.folio === f)).filter(Boolean);
    const eq = ps.reduce((s, p) => s + hjEq(p), 0);
    const total = saldo + eq;
    const exc = Math.max(0, total - meta);
    out.push({ rec: i, num: num(i.num), ps, eq, pz: ps.reduce((s, p) => s + num(p.cantidad), 0), saldo, total, exc, cerrado: true });
    saldo = exc;
  });
  const open = peds.filter(p => !assigned.has(p.folio));
  const eq = open.reduce((s, p) => s + hjEq(p), 0);
  out.push({ rec: null, num: (closed.length ? num(closed[closed.length - 1].num) : 0) + 1, ps: open, eq, pz: open.reduce((s, p) => s + num(p.cantidad), 0), saldo, total: saldo + eq, exc: Math.max(0, saldo + eq - meta), cerrado: false, meta });
  return out;
}
function hjCerrarInforme() {
  const inf = hjInformesCalc(); const cur = inf[inf.length - 1]; const meta = num(hjS().meta) || 800;
  if (cur.total < meta) { toast(`Faltan ${hjFmtEq(meta - cur.total)} equivalencias para cerrar el informe`, 'error'); return; }
  const folios = []; let acc = cur.saldo;
  for (const p of cur.ps) { folios.push(p.folio); acc += hjEq(p); if (acc >= meta) break; }
  if (!confirm(`¿Cerrar el informe ${String(cur.num).padStart(3, '0')} con ${folios.length} pedido(s) y ${hjFmtEq(acc)} equivalencias (incluye saldo)?`)) return;
  upsert('hjInformes', { num: cur.num, folios, factura: '', pagada: false, cerradoEn: today() });
  toast('Informe cerrado', 'ok');
}

/* ---- Estimación por lote ---- */
function hjRealRate(opId) {
  let min = 0, pz = 0, n = 0;
  list('hjJornadas').forEach(j => (j.bloques || []).forEach(b => { if (b.opId === opId && num(b.piezas) > 0) { min += num(b.minutos); pz += num(b.piezas); n++; } }));
  return n ? { n, minPorPieza: min / pz } : null;
}
const hhmmToMin = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
function hjEstimate() {
  const e = hjS().est; const v = e.vol;
  const cajas = num(v.chica) + num(v.mediana) + num(v.grande) + num(v.trofeo);
  const q = { chica: num(v.chica), mediana: num(v.mediana), grande: num(v.grande), trofeo: num(v.trofeo), cajas, tapas: cajas + num(v.tapa), tapaFrente: num(v.tapaFrente), tapaInterior: num(v.tapaInterior) };
  const rows = e.ops.map(o => { const qty = num(q[o.base]); const lotes = qty && num(o.pzs) > 0 ? Math.ceil(qty / num(o.pzs)) : 0; return { ...o, qty, lotes, minTot: lotes * num(o.min), real: hjRealRate(o.id) }; });
  const maq = rows.filter(r => r.tipo === 'maquina').reduce((s, r) => s + r.minTot, 0) / 60;
  const hum = rows.filter(r => r.tipo === 'humano').reduce((s, r) => s + r.minTot, 0) / 60;
  const j = e.jornada;
  let turno = hhmmToMin(j.salida) - hhmmToMin(j.entrada); if (turno <= 0) turno += 1440;
  const efectiva = Math.max(0, turno - num(j.comida) - num(j.descansos)) / 60;
  const usada = Math.min(num(j.objetivo) || efectiva, efectiva);
  const diaria = Math.max(0.5, usada - (num(j.prep) + num(j.compu)) / 60);
  const base = j.solapar ? Math.max(maq, hum) : maq + hum;
  const total = base * (1 + num(j.imprevistos) / 100);
  const dias = total > 0 ? Math.ceil(total / diaria) : 0;
  return { q, cajas, rows, maq, hum, efectiva, usada, diaria, base, total, dias, ultimo: dias ? total - (dias - 1) * diaria : 0, holgura: efectiva - usada };
}
function hjSetEst(path, value) {
  const s = JSON.parse(JSON.stringify(hjS()));
  const [a, b, c] = path.split('.');
  if (a === 'ops') { s.est.ops[+b][c] = ['min', 'pzs'].includes(c) ? num(value) : value; }
  else if (a === 'vol') s.est.vol[b] = Math.max(0, num(value));
  else if (a === 'jornada') s.est.jornada[b] = b === 'solapar' ? !!value : (['entrada', 'salida'].includes(b) ? value : num(value));
  else s[a] = value;
  updateSettings({ hj: s });
}

async function hjSimAnexar(kind) {
  const p = getRec('hjPedidos', ui.hjSimPed); if (!p) { toast('Elige el pedido', 'error'); return; }
  const L = simApi(); if (!L) { toast('El simulador aún está cargando. Intenta en unos segundos.', 'error'); return; }
  const n = new Date(); const stamp = `${ymd(n).replace(/-/g, '')}-${pad(n.getHours())}${pad(n.getMinutes())}`;
  let files = [], resumen = '';
  try {
    resumen = String(L.summary() || '').replace(/\*/g, '');
    if (kind === 'png') {
      const c = await L.previewCanvas();
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      files.push(new File([blob], `${p.folio}_simulacion_${stamp}.png`, { type:'image/png' }));
    } else {
      toast('Vectorizando y generando DXF…');
      const out = await L.produccion('cm', 0.1);
      if (!out) { toast('No hay zonas con diseño para exportar', 'error'); return; }
      files.push(new File([out.dxf], `${p.folio}_grabado_${out.zones.join('')}_${stamp}.dxf`, { type:'application/dxf' }));
      files.push(new File([out.svg], `${p.folio}_grabado_${out.zones.join('')}_${stamp}.svg`, { type:'image/svg+xml' }));
      resumen += `\nArchivo de producción: zonas ${out.zones.join(', ')} · lámina ${(out.W / 10).toFixed(1)} × ${(out.H / 10).toFixed(1)} cm (DXF en cm). Revisar en LightBurn/RDWorks antes de producir.`;
    }
  } catch (e) { console.error(e); toast('No se pudo generar el archivo del simulador', 'error'); return; }
  const anexos = [...(p.anexos || [])]; const adjuntos = [...(p.adjuntos || [])];
  for (const f of files) {
    let meta = null;
    if (Sync.hasToken()) {
      try { Sync.setStatus('saving', 'Subiendo anexo…'); meta = await Sync.uploadFile(f, { description: `Simulación de grabado · ${p.folio} ${p.titulo}` }); adjuntos.push(meta); }
      catch (e) { toast(`No se pudo subir ${f.name}: ${e.message}`, 'error', 5000); }
    }
    if (!meta) download(f.name, f, f.type);
    anexos.push({ tipo: kind === 'png' ? 'Vista previa' : (f.name.endsWith('.dxf') ? 'Producción DXF' : 'Producción SVG'), name: f.name, link: meta ? meta.link : '', fileId: meta ? meta.fileId : '', resumen, at: Date.now() });
  }
  const cur = getRec('hjPedidos', p.id);
  const patch = { id: p.id, anexos, adjuntos, bitacora: hjLog(cur, `Anexo de grabado: ${files.map(f => f.name).join(', ')}${adjuntos.length > (cur.adjuntos || []).length ? ' (en Drive)' : ' (descargado localmente)'}`) };
  if (kind === 'png' && hjStepIdx(cur) < 1) patch.notas = cur.notas || '';
  upsert('hjPedidos', patch, { silent:true });
  render(); toast(kind === 'png' ? 'Vista previa anexada al pedido' : 'Archivos de producción anexados al pedido', 'ok');
}

window.addEventListener('offline', () => Sync.setStatus('offline'));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Sync.hasToken()) Sync.syncNow(); });
window.addEventListener('storage', e => { if (e.key === KEYS.db) { db = normalizeDB(readLS(KEYS.db, null)); render(); } });
window.addEventListener('beforeunload', e => { if (Sync.state.dirty && Sync.hasToken()) { e.preventDefault(); e.returnValue = ''; } });

/* ============================ PWA ============================ */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (ui.route === 'ajustes') render(); });
function drawIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  x.fillStyle = '#0f172a'; x.fillRect(0, 0, size, size);
  const s = size / 64 * 0.78, o = size * 0.11;
  x.save(); x.translate(o, o); x.scale(s, s);
  x.fillStyle = '#f97316'; x.fill(new Path2D(LOGO_PATH), 'evenodd');
  x.strokeStyle = '#fff'; x.lineWidth = 5; x.lineCap = 'round';
  [[13, 49, 27, 35], [22, 53, 38, 37], [33, 54, 48, 39]].forEach(([a, b, c2, d]) => { x.beginPath(); x.moveTo(a, b); x.lineTo(c2, d); x.stroke(); });
  x.restore();
  return c.toDataURL('image/png');
}
function setupPWA() {
  try {
    const i192 = drawIcon(192), i512 = drawIcon(512);
    $('#faviconLink').href = drawIcon(64);
    $('#appleIconLink').href = drawIcon(180);
    const base = location.href.split('#')[0].split('?')[0];
    const manifest = {
      name:'Centro de Control · CNC Manufacturing MX', short_name:'Control CNC', description:'Proyectos, producción, ventas y finanzas sincronizados con Google Drive.',
      lang:'es-MX', start_url: base, scope: base.replace(/[^/]*$/, ''), display:'standalone', orientation:'any',
      background_color:'#0f172a', theme_color:'#0f172a',
      icons:[{ src:i192, sizes:'192x192', type:'image/png', purpose:'any' }, { src:i512, sizes:'512x512', type:'image/png', purpose:'any maskable' }]
    };
    $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type:'application/manifest+json' }));
  } catch (e) { /* entornos sin canvas */ }
  /* Service worker opcional: si existe sw.js junto a index.html, se registra para modo sin conexión total. */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    fetch('sw.js', { method:'HEAD', cache:'no-store' }).then(r => {
      const ct = r.headers.get('content-type') || '';
      if (r.ok && /javascript/.test(ct)) navigator.serviceWorker.register('sw.js').catch(() => {});
    }).catch(() => {});
  }
}

/* ============================ ARRANQUE ============================ */
function boot() {
  setupPWA();
  render();
  Sync.setStatus(Sync.computeIdle());
  if (cfg.clientId) Sync.waitGIS().then(ok => { if (ok) Sync.initClient(); });
  if (Sync.hasToken()) Sync.syncNow();
  setInterval(() => { const c = $('#liveClock'); if (c) c.textContent = clockText(); }, 1000);
  setInterval(() => { if (document.visibilityState === 'visible' && Sync.hasToken() && navigator.onLine) Sync.syncNow(); else if (!Sync.hasToken() && Sync.status === 'ok') Sync.setStatus(Sync.computeIdle()); }, POLL_MS);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
</script>
