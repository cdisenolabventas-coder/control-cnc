<script>
(function(){
// ---------- textures ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
const PXMM=2, TW=1000, TH=400; // texture covers 1000 x 400 mm
function grainLines(ctx,y0,h,w,col,n,r,wav){
  for(let i=0;i<n;i++){
    const y=y0+r()*h, a=0.05+r()*0.18, amp=wav*(0.3+r()), f=0.002+r()*0.006, ph=r()*6.28;
    ctx.strokeStyle=col.replace("A",a.toFixed(3)); ctx.lineWidth=0.6+r()*2.2;
    ctx.beginPath();

function pineCanvas(seed){
  const c=document.createElement("canvas");c.width=TW*PXMM;c.height=TH*PXMM;const ctx=c.getContext("2d");const r=rng(seed);

    const base=`hsl(${36+tone*6},${52+tone*10}%,${74-tone*12}%)`;
    ctx.fillStyle=base;ctx.fillRect(0,y,c.width,h);

    for(let k=0;k<3;k++){const yy=y+r()*h;ctx.fillStyle=`rgba(170,110,50,${0.06+r()*0.08})`;ctx.fillRect(0,yy,c.width,(1+r()*3)*PXMM)}

      for(let j=0;j<=h;j+=4*PXMM){ctx.lineTo(x+((j/(4*PXMM))%2?6*PXMM:0),y+j)}ctx.stroke();

}

  let y=0;

      const sg=ctx.createLinearGradient(0,sy,0,sy+sh);sg.addColorStop(0,"rgba(214,180,132,0)");sg.addColorStop(0.3,"rgba(214,180,132,.85)");sg.addColorStop(0.7,"rgba(200,163,115,.8)");sg.addColorStop(1,"rgba(200,163,115,0)");

    grainLines(ctx,y,h,c.width,"rgba(170,110,70,A)",25,r,9*PXMM);

    ctx.fillStyle="rgba(40,20,10,0.25)";

}
const texCache={};
function woodTex(kind){

  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;

function woodMat(kind){return new THREE.MeshStandardMaterial({map:woodTex(kind).tex,roughness:kind==="pino"?0.62:0.48})}
function mmUV(geo,offU,offV,grainZ){
  const p=geo.attributes.position,n=geo.attributes.normal,uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),nx=Math.abs(n.getX(i)),ny=Math.abs(n.getY(i));
    let u,v;
    if(nx>0.5){u=z;v=y}else if(ny>0.5){u=grainZ?z:x;v=grainZ?x:z}else{u=grainZ?y:x;v=grainZ?x:y}
    uv.setXY(i,(u+offU)/TW,(v+offV)/TH);
  }
  uv.needsUpdate=true;return geo;
}

// ---------- logo ----------
let logoMask=null,logoAspect=1;
function setLogoFromImage(img){
  const s=600/Math.max(img.width,img.height),w=Math.max(1,Math.round(img.width*s)),h=Math.max(1,Math.round(img.height*s));
  const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(img,0,0,w,h);
  const d=x.getImageData(0,0,w,h),p=d.data;let transp=false;for(let i=3;i<p.length;i+=4)if(p[i]<250){transp=true;break}
  let minX=w,minY=h,maxX=-1,maxY=-1;
  for(let i=0;i<p.length;i+=4){const m=transp?p[i+3]:255-Math.min(p[i],p[i+1],p[i+2]);const a=m>40?Math.min(255,m*1.3):0;
    p[i]=p[i+1]=p[i+2]=255;p[i+3]=a;if(a){const k=i/4,xx=k%w,yy=(k/w)|0;if(xx<minX)minX=xx;if(xx>maxX)maxX=xx;if(yy<minY)minY=yy;if(yy>maxY)maxY=yy}}
  if(maxX<minX)return false;

  logoMask=o;logoAspect=cw/ch;return true;
}

const state={wood:"pino",lid:"lisa",fill:"quemado",lpos:"c",lsize:45,preset:"sol",L:350,W:100,H:120,t:12,divZ:0,divX:0,divT:"6",bottle:"1",open:0};
const PRESETS={sol:{L:350,W:100,H:120,t:12,divZ:0,divX:0},rec:{L:356,W:126,H:126,t:18,divZ:0,divX:0},dos:{L:356,W:198,H:126,t:15,divZ:1,divX:0}};
const WOODS={pino:"PINO ALISTONADO",parota:"PAROTA MACIZA",hibrida:"PINO + TAPA PAROTA"};
const BOT_D=76,BOT_L=306;
function dims(){const {L,W,H,t}=state;const lidT=t>=12?6:4;const dt=+state.divT;
  const iw=W-2*t,il=L-2*t,ih=H-t-lidT-4;const nz=state.divZ+1,nx=state.divX+1;
  const cw=(iw-state.divZ*dt)/nz,cl=(il-state.divX*dt)/nx;return {L,W,H,t,lidT,dt,iw,il,ih,nz,nx,cw,cl}}

function lidTextures(kind,lw,ld,margin,D){
  const S=4,W=Math.round(lw*S),H=Math.round(ld*S);
  const src=woodTex(kind).canvas;
  const col=document.createElement("canvas");col.width=W;col.height=H;const cx=col.getContext("2d");
  cx.drawImage(src,40*PXMM,30*PXMM,Math.min(lw,950)*PXMM,Math.min(ld,360)*PXMM,0,0,W,H);
  const bump=document.createElement("canvas");bump.width=W;bump.height=H;const bx=bump.getContext("2d");bx.fillStyle="#fff";bx.fillRect(0,0,W,H);
  const alpha=document.createElement("canvas");alpha.width=W;alpha.height=H;const ax=alpha.getContext("2d");ax.fillStyle="#fff";ax.fillRect(0,0,W,H);
  const midX=W*0.47,midY=H/2;
  const lh=Math.min(state.lsize,ld*0.7-2*margin*0.3)*S,lwid=Math.min(lh*logoAspect,(lw-2*margin-40)*S),lhh=lwid/logoAspect;

    ax.strokeStyle="#fff";ax.lineWidth=7*S;
    const pts=()=>{const e=r()*4|0;return e===0?[m+r()*(W-2*m),m]:e===1?[m+r()*(W-2*m),H-m]:e===2?[m,m+r()*(H-2*m)]:[W-m,m+r()*(H-2*m)]};

    ax.lineWidth=6*S;[0.36,0.64].forEach(f=>{ax.beginPath();ax.moveTo(m,H*f);ax.lineTo(W-m,H*f+(f-.5)*30*S);ax.stroke()});

    bx.fillStyle="#999";bx.beginPath();bx.ellipse(nx,midY,9*S,Math.min(18,ld*0.22)*S,0,0,6.28);bx.fill();

  }

    const x0=lx-lwid/2,y0=ly-lhh/2;
    const tmp=document.createElement("canvas");tmp.width=W;tmp.height=H;const tx=tmp.getContext("2d");
    tx.drawImage(logoMask,x0,y0,lwid,lhh);tx.globalCompositeOperation="source-in";
    tx.fillStyle={quemado:kind==="pino"?"rgb(92,52,22)":"rgb(38,20,10)",negro:"rgb(22,20,19)",dorado:"rgb(196,152,72)"}[state.fill];tx.fillRect(0,0,W,H);
    if(state.fill==="quemado"){cx.save();cx.filter="blur(3px)";cx.globalAlpha=kind==="pino"?0.45:0.3;cx.drawImage(tmp,0,0);cx.restore()}

    b2x.drawImage(logoMask,x0,y0,lwid,lhh);b2x.globalCompositeOperation="source-in";b2x.fillStyle="#555";b2x.fillRect(0,0,W,H);bx.drawImage(b2,0,0);

// ---------- scene ----------
const canvas=document.getElementById("c");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));

function addBox(g,mat,w,h,d,x,y,z,grainZ,seed){
  const geo=mmUV(new THREE.BoxGeometry(w,h,d),seed*137%600,seed*61%200,grainZ);
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;g.add(m);return m;
}
function addBottle(g,x0,z,yBase,R){
  const prof=[[0,0],[36,0],[38,3],[38,205],[36,225],[28,245],[16,262],[14.5,270],[14.5,298],[15.5,300],[15.5,306],[0,306]].map(p=>new THREE.Vector2(Math.min(p[0],R),p[1]));
  const bottle=new THREE.Mesh(new THREE.LatheGeometry(prof,48),new THREE.MeshStandardMaterial({color:0x10261a,roughness:.12,metalness:.25}));
  bottle.rotation.z=-Math.PI/2;bottle.position.set(x0,yBase+R+1,z);bottle.castShadow=true;g.add(bottle);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(15.8,15.8,50,40),new THREE.MeshStandardMaterial({color:0x5a0f1a,roughness:.35,metalness:.4}));
  cap.rotation.z=Math.PI/2;cap.position.set(x0+282,bottle.position.y,z);g.add(cap);
  const label=new THREE.Mesh(new THREE.CylinderGeometry(Math.min(38.4,R+.4),Math.min(38.4,R+.4),90,48,1,true),new THREE.MeshStandardMaterial({color:0xece6da,roughness:.8}));
  label.rotation.z=Math.PI/2;label.position.set(x0+85,bottle.position.y,z);g.add(label);
}
function build(){
  if(group){scene.remove(group);group.traverse(o=>{if(o.geometry)o.geometry.dispose()})}
  while(state.divZ>0&&dims().cw<15)state.divZ--;
  while(state.divX>0&&dims().cl<15)state.divX--;
  const D=dims();cur=D;const {L,W,H,t,lidT,dt,iw,il,ih,nz,nx,cw,cl}=D;
  group=new THREE.Group();
  const bodyKind=state.wood==="parota"?"parota":"pino",lidKind=state.wood==="pino"?"pino":"parota";
  const bm=woodMat(bodyKind);
  addBox(group,bm,L-2*t,t,W-2*t,0,t/2,0,false,1);
  addBox(group,bm,L,H,t,0,H/2,W/2-t/2,false,2);
  addBox(group,bm,L,H,t,0,H/2,-W/2+t/2,false,3);
  addBox(group,bm,t,H-lidT-4,W-2*t,-L/2+t/2,(H-lidT-4)/2,0,true,4);
  addBox(group,bm,t,H-lidT-6,W-2*t,L/2-t/2,(H-lidT-6)/2,0,true,5);
  addBox(group,bm,t/2,lidT+4,W-2*t,-L/2+t/4,H-(lidT+4)/2,0,true,6);
  const grooveMat=new THREE.MeshBasicMaterial({color:0x2a1a10});
  [1,-1].forEach(s=>{const gm=new THREE.Mesh(new THREE.BoxGeometry(L-0.2,0.8,0.4),grooveMat);gm.position.set(0,H-4-lidT-0.6,s*(W/2-t)-s*0.15);group.add(gm)});
  const inner=new THREE.Mesh(new THREE.BoxGeometry(il-0.5,0.5,iw-0.5),new THREE.MeshStandardMaterial({color:0x2b2421,roughness:.9}));inner.position.set(0,t+0.3,0);inner.receiveShadow=true;group.add(inner);
  // separaciones internas
  const divH=ih-2, dm=woodMat(bodyKind);
  for(let i=1;i<nz;i++){const z=-iw/2+i*cw+(i-0.5)*dt;addBox(group,dm,il,divH,dt,0,t+divH/2,z,false,20+i)}
  for(let j=1;j<nx;j++){const x=-il/2+j*cl+(j-0.5)*dt;addBox(group,dm,dt,divH-0.5,iw-0.2,x,t+divH/2,0,true,40+j)}
  // tapa
  const lidLen=L-t/2,lidW=W-t,margin=t/2+8;
  const tx=lidTextures(lidKind,lidLen,lidW,margin,D);lastLogo=tx.logoMM;
  const lm=woodMat(lidKind);
  const top=new THREE.MeshStandardMaterial({map:tx.map,bumpMap:tx.bump,bumpScale:1.6,roughness:lidKind==="pino"?0.6:0.46,alphaMap:tx.alpha,alphaTest:0.5,side:THREE.DoubleSide});
  const lidGeo=mmUV(new THREE.BoxGeometry(lidLen,lidT,lidW),20,40,false);
  const uv=lidGeo.attributes.uv,nrm=lidGeo.attributes.normal,pos=lidGeo.attributes.position;
  for(let i=0;i<uv.count;i++){if(Math.abs(nrm.getY(i))>0.5)uv.setXY(i,pos.getX(i)/lidLen+0.5,0.5-pos.getZ(i)/lidW)}
  lidMesh=new THREE.Mesh(lidGeo,[lm,lm,top,top,lm,lm]);lidMesh.castShadow=true;lidMesh.receiveShadow=true;
  if(tx.alpha)lidMesh.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,alphaMap:tx.alpha,alphaTest:0.5});
  lidMesh.userData.base=t/4;lidMesh.position.set(t/4,H-4-lidT/2,0);group.add(lidMesh);
  // botellas: una por compartimento longitudinal si caben
  if(state.bottle==="1"&&cw>=BOT_D&&ih>=BOT_D&&cl>=BOT_L+4){
    const R=Math.min(38,cw/2-0.5);
    for(let i=0;i<nz;i++){const zc=-iw/2+i*(cw+dt)+cw/2;
      for(let j=0;j<nx;j++){const xc=-il/2+j*(cl+dt)+cl/2;
        if(cw-BOT_D>=10){ // cunas
          const sh=new THREE.Shape(),hc=R+2,half=cw/2-0.5,rr=Math.min(R+1,half-1);
          sh.moveTo(-half,0);sh.lineTo(half,0);sh.lineTo(half,hc);sh.lineTo(rr,hc);sh.absarc(0,hc,rr,0,Math.PI,true);sh.lineTo(-half,hc);sh.lineTo(-half,0);
          const cg=new THREE.ExtrudeGeometry(sh,{depth:6,bevelEnabled:false}),cm=new THREE.MeshStandardMaterial({color:0x1b1b1c,roughness:.7});
          [-0.3,0.3].forEach(f=>{const m=new THREE.Mesh(cg,cm);m.rotation.y=Math.PI/2;m.position.set(xc+f*cl,t,zc);m.castShadow=m.receiveShadow=true;group.add(m)});
        }
        addBottle(group,xc-BOT_L/2,zc,t,R);
      }}
  }
  scene.add(group);
  key.shadow.camera.left=key.shadow.camera.bottom=-Math.max(600,L);key.shadow.camera.right=key.shadow.camera.top=Math.max(600,L);key.shadow.camera.updateProjectionMatrix();
  applyOpen();updateUI();
}

const $=id=>document.getElementById(id);
function fmt(n){return Math.round(n).toLocaleString("es-MX")}
function updateUI(){
  document.querySelectorAll(".seg").forEach(s=>s.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(String(state[s.dataset.k])===b.dataset.val))));
  const D=cur;["L","W","H"].forEach(k=>{if(document.activeElement!==$("d"+k))$("d"+k).value=state[k]});if(document.activeElement!==$("dT"))$("dT").value=state.t;
  $("divZ").value=state.divZ;$("divX").value=state.divX;$("divZOut").textContent=state.divZ;$("divXOut").textContent=state.divX;
  $("lsize").value=state.lsize;$("lsizeOut").textContent=(lastLogo&&state.fill!=="none"?Math.round(lastLogo.h):state.lsize)+" mm";
  $("tag").textContent=`${WOODS[state.wood]} · ${D.L} × ${D.W} × ${D.H} mm`;
  const comps=D.nz*D.nx;
  const laser=lastLogo&&state.fill!=="none"?lastLogo.w*lastLogo.h/0.1/300/60*1.3:0;
  $("spec").innerHTML=`<tr><td>Exterior L × A × H</td><td>${D.L} × ${D.W} × ${D.H}</td></tr>
    <tr><td>Interior útil</td><td>${fmt(D.il)} × ${fmt(D.iw)} × ${fmt(D.ih)}</td></tr>
    <tr><td>Pared / fondo</td><td>${D.t} mm</td></tr>
    <tr><td>Tapa (corredera)</td><td>${D.lidT} mm · ranura ${D.lidT+1} mm</td></tr>
    <tr><td>Compartimentos</td><td>${comps} · ${fmt(D.cl)} × ${fmt(D.cw)} c/u</td></tr>
    ${state.divZ+state.divX?`<tr><td>Divisores</td><td>${state.divZ} long. + ${state.divX} transv. · ${D.dt} mm</td></tr>`:""}
    <tr><td>Logo</td><td>${state.fill==="none"||!lastLogo?"—":`${Math.round(lastLogo.w)} × ${Math.round(lastLogo.h)} mm · láser ≈ ${Math.max(.5,laser).toFixed(1)} min`}</td></tr>`;
  const n=$("note");let msg="",warn=false;
  const fitW=D.cw-BOT_D,fitH=D.ih-BOT_D,fitL=D.cl-BOT_L;
  if(fitW<0||fitH<0||fitL<0){warn=true;msg=`<b>No cabe una botella de 750 ml (Ø76 × 306)</b> en cada compartimento: ${fitW<0?`falta ${-Math.round(fitW)} mm de ancho. `:""}${fitH<0?`falta ${-Math.round(fitH)} mm de alto. `:""}${fitL<0?`falta ${-Math.round(fitL)} mm de largo.`:""} Sirve para accesorios (sacacorchos, copas, quesos) o ajusta medidas.`}
  else if(fitW<10||fitH<6){warn=true;msg=`<b>Holgura muy justa:</b> ${Math.round(fitW)} mm de ancho y ${Math.round(fitH)} mm de alto libres. Sin espacio para cuna y con riesgo de que la madera se cierre con la humedad. Recomendado ≥ 10 mm.`}
  else msg=`<b>Cabe ${comps>1?comps+" botellas":"la botella"}</b> con ${Math.round(fitW)} mm de holgura en ancho y ${Math.round(fitH)} mm en alto${fitW>=10?", con cuna MDF 6 mm":""}.`;
  if(D.t<12)msg+=" <b>Pared menor a 12 mm:</b> la ranura de la tapa deja muy poca madera; usa tapa de 4 mm o sube la pared.";
  n.innerHTML=msg;n.classList.toggle("warn",warn);
}
