 {wood:"nogal",shape:"rect",d:[500,250],thk:25,handle:1,groove:0,edge:"r"},

const state={cavForm:"same",cav:"none",stone:"pizarra",stoneT:"8",margin:"35",showStone:"1",logo:"quemado",lpos:"c",lsize:"60",mode:"col",wood:"parota",shape:"rect",size:"1",thk:"25",handle:"0",groove:"1",edge:"r"};

// ---------- procedural wood ----------
function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}

const SPEC={

 tzalam:{h:14,s:40,l:33,lv:5,strip:[70,110],dark:"60,22,12",light:"175,95,60",n:60,wav:3.5,sap:.12,sapc:"196,150,96",knot:0,pores:1400},
 rosamorada:{h:28,s:40,l:62,lv:6,strip:[60,100],dark:"125,80,52",light:"240,205,170",n:55,wav:3,sap:0,knot:0,pores:900},
 nogal:{h:20,s:28,l:24,lv:5,strip:[90,150],dark:"28,16,10",light:"130,90,62",n:70,wav:8,sap:.3,sapc:"190,158,118",knot:0,pores:1500}

function woodCanvas(kind,seed){
  const p=SPEC[kind];const c=document.createElement("canvas");c.width=TW*PXMM;c.height=TH*PXMM;const ctx=c.getContext("2d");const r=rng(seed);

const cache={};
function woodTex(kind){

function planarUV(geo,ou,ov){
  const p=geo.attributes.position,n=geo.attributes.normal;
  if(!geo.attributes.uv)geo.setAttribute("uv",new THREE.BufferAttribute(new Float32Array(p.count*2),2));
  const uv=geo.attributes.uv;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),ny=Math.abs(n.getY(i)),nx=Math.abs(n.getX(i)),nz=Math.abs(n.getZ(i));

// ---------- shapes (mm, plane XY) ----------
const HW=60,HL=110,HOLE=12;
function rectShape(w,h,r,handle,inset){

  if(handle){const hw=HW/2-inset,cx=w/2+HL-HW/2+inset;
    s.lineTo(w/2,-hw-14);s.quadraticCurveTo(w/2,-hw,w/2+14,-hw);s.lineTo(cx,-hw);s.absarc(cx,0,hw,-Math.PI/2,Math.PI/2,false);
    s.lineTo(w/2+14,hw);s.quadraticCurveTo(w/2,hw,w/2,hw+14);
    const ho=new THREE.Path();ho.absarc(cx,0,HOLE+inset,0,Math.PI*2,true);s.holes.push(ho);}

function roundShape(D,handle,inset){

  if(!handle){s.absarc(0,0,R,0,Math.PI*2,false);return s}

  s.lineTo(cx,-hw);s.absarc(cx,0,hw,-Math.PI/2,Math.PI/2,false);s.lineTo(R*Math.cos(a),hw);
  const ho=new THREE.Path();ho.absarc(cx,0,HOLE+inset,0,Math.PI*2,true);s.holes.push(ho);
  return s;
}
function smoothSides(geo){
  const p=geo.attributes.position,n=geo.attributes.normal,acc=new Map(),key=i=>`${p.getX(i).toFixed(2)},${p.getY(i).toFixed(2)},${p.getZ(i).toFixed(2)}`;
  const a=new THREE.Vector3(),b=new THREE.Vector3(),c=new THREE.Vector3(),fn=new THREE.Vector3();
  const cap=new Uint8Array(p.count);
  for(let i=0;i<p.count;i+=3){
    a.fromBufferAttribute(p,i);b.fromBufferAttribute(p,i+1);c.fromBufferAttribute(p,i+2);
    fn.subVectors(c,b).cross(a.clone().sub(b));const area=fn.length();if(area<1e-9)continue;fn.divideScalar(area);
    if(Math.abs(fn.z)>0.999){cap[i]=cap[i+1]=cap[i+2]=1;for(let k=0;k<3;k++)n.setXYZ(i+k,0,0,Math.sign(fn.z));continue}
    for(let k=0;k<3;k++){const kk=key(i+k);const v=acc.get(kk)||new THREE.Vector3();v.addScaledVector(fn,area);acc.set(kk,v)}
  }
  for(let i=0;i<p.count;i++){if(cap[i])continue;const v=acc.get(key(i));if(v){v.normalize();n.setXYZ(i,v.x,v.y,v.z)}}

function makeBoard(cfg,seed){

  const bt=cfg.edge==="c"?4:Math.min(6,cfg.thk*.22),bs=bt,segs=cfg.edge==="c"?1:5;
  const shp=cfg.shape==="rect"?rectShape(cfg.d[0],cfg.d[1],22,cfg.handle,bs):roundShape(cfg.d[0],cfg.handle,bs);
  if(cfg.cav)shp.holes.push(new THREE.Path(cavShape(cfg,cfg.cav.m).getPoints(64).reverse()));
  let geo=new THREE.ExtrudeGeometry(shp,{depth:cfg.thk-2*bt,bevelEnabled:true,bevelThickness:bt,bevelSize:bs,bevelSegments:segs,curveSegments:64});
  smoothSides(geo);

  const mesh=new THREE.Mesh(geo,m.face);mesh.castShadow=mesh.receiveShadow=true;g.add(mesh);
  if(cfg.groove){

      <tr><td>${c.cav.type==="pasante"?"Ceja de apoyo":"Fondo de madera"}</td><td>${c.cav.type==="pasante"?LEDGE+" mm × "+ci.floor.toFixed(1)+" mm":ci.floor.toFixed(1)+" mm"}</td></tr>
      <tr><td>Piedra a pedir</td><td>${STONES[c.cav.stone].name} ${!ci.circ?Math.round(ci.stoneW)+" × "+Math.round(ci.stoneH)+" esquinas r"+CAV_R:"Ø"+Math.round(ci.stoneW)} × ${c.cav.stoneT}</td></tr>
      <tr><td>Peso de la piedra</td><td>${fmt(stoneKg,2)} kg</td></tr>
      <tr><td>Router (desbaste)</td><td>≈ ${fmt(routerMin,0)} min · ${passes} pasadas</td></tr>`:""}`;
    let nt=WOODS[c.wood].note;
    if(ci){nt+=`<br><br><b>Cavidad:</b> el router deja radio interno; pide la piedra ${!ci.circ?"con esquinas boleadas r"+CAV_R+" mm y ":""}0.5 mm más chica por lado y pégala con silicón neutro o epóxico flexible para que la madera pueda moverse.`;

      if(c.cav.stone==="marmol"||c.cav.stone==="travertino")nt+=" Mármol y travertino se manchan con limón y vino: sella con impermeabilizante para piedra de grado alimenticio.";

    note.innerHTML=nt;
  }
